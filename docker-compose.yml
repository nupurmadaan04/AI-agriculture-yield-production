# =============================================================================
# Agricultural Decision Intelligence Platform — Production Docker Compose
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri_platform_backend
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:80
      - LOG_LEVEL=INFO
    # In production, backend is internal to agri_network.
    # Expose internally to frontend/nginx; uncomment ports for direct host debugging.
    expose:
      - "8000"
    # ports:
    #   - "8000:8000"
    volumes:
      - ./reports:/app/reports
      - ./Datasets/metadata:/app/Datasets/metadata
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - agri_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agri_platform_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agri_network

networks:
  agri_network:
    driver: bridge
